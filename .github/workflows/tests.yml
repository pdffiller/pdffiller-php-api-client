name: Tests

on:
  push:
    branches:
      - 'master'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    # GitHub-hosted runner: this repository is public, so pull requests from forks
    # must not run on self-hosted runners.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: ['highest']
        include:
          # Lowest supported PHP with the lowest allowed dependencies
          - php: '8.1'
            dependencies: 'lowest'
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    steps:
      - uses: actions/checkout@v4

      - name: Set PHP version
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          coverage: none

      - name: Composer Install
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update -n --prefer-dist --no-scripts --prefer-lowest --prefer-stable
          else
            composer update -n --prefer-dist --no-scripts
          fi

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit
