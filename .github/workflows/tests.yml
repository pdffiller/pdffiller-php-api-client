name: Tests

on:
  push:
    branches:
      - 'master'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    # GitHub-hosted runner: this repository is public, so pull requests from forks
    # must not run on self-hosted runners.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        guzzle: ['7', '8']
        dependencies: ['highest']
        include:
          # Lowest supported PHP with the lowest allowed dependencies
          - php: '8.1'
            guzzle: '7'
            dependencies: 'lowest'
          - php: '8.1'
            guzzle: '8'
            dependencies: 'lowest'
    name: PHP ${{ matrix.php }}, Guzzle ${{ matrix.guzzle }} (${{ matrix.dependencies }})
    steps:
      - uses: actions/checkout@v4

      - name: Set PHP version
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          coverage: none

      - name: Composer Install
        run: |
          flags="-n --prefer-dist --no-scripts --with guzzlehttp/guzzle:^${{ matrix.guzzle }}"
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            flags="$flags --prefer-lowest --prefer-stable"
          fi
          composer update $flags

      - name: Installed HTTP packages
        run: |
          composer show | grep -E '^(guzzlehttp/(guzzle|psr7|promises)|psr/http-message|league/oauth2-client) '
          composer show guzzlehttp/guzzle | grep -E '^versions *: \* ${{ matrix.guzzle }}\.'

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit
